name: 'risk_data_analysis_platform'
version: '1.0.0'

profile: 'risk_data_analysis_platform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Seeds are for small static lookup tables only.
# Raw data is loaded with scripts/load_raw_data.sh.

models:
  risk_data_analysis_platform:
    +tags: ["risk"]
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
